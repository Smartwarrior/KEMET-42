<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="marsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a45"/>
      <stop offset="50%" stop-color="#e2552b"/>
      <stop offset="100%" stop-color="#9b2c12"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8a99ad"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fd1c5" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#f6c945"/>
      <stop offset="100%" stop-color="#ff6a3d"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fond écusson aérospatial -->
  <circle cx="256" cy="256" r="240" fill="#070a14" stroke="url(#ringGrad)" stroke-width="6" stroke-dasharray="1450 60" />
  <circle cx="256" cy="256" r="226" fill="#0b1120" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Constellations & étoiles d'arrière plan -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="110" r="1.5" />
    <circle cx="160" cy="80" r="2" />
    <circle cx="390" cy="130" r="1.5" />
    <circle cx="360" cy="90" r="2.5" />
    <circle cx="410" cy="340" r="1.5" />
    <circle cx="95" cy="320" r="2" />
    <circle cx="130" cy="380" r="1.5" />
  </g>

  <!-- Croissant de Lune argentée (Artemis) -->
  <path d="M 175 140 A 55 55 0 0 0 215 210 A 45 45 0 1 1 175 140 Z" fill="url(#moonGrad)" opacity="0.85" filter="url(#glow)"/>

  <!-- Planète Mars centrale -->
  <circle cx="256" cy="275" r="115" fill="url(#marsGrad)" />
  
  <!-- Cratères martiens stylisés -->
  <ellipse cx="220" cy="245" rx="18" ry="11" fill="#ba3818" opacity="0.6"/>
  <ellipse cx="295" cy="310" rx="26" ry="14" fill="#88220b" opacity="0.5"/>
  <ellipse cx="280" cy="235" rx="12" ry="7" fill="#ba3818" opacity="0.5"/>
  <ellipse cx="195" cy="315" rx="15" ry="9" fill="#88220b" opacity="0.6"/>

  <!-- Dôme d'avant-poste géodésique sur Mars -->
  <path d="M 226 275 A 30 25 0 0 1 286 275 Z" fill="#e0f2fe" opacity="0.9" filter="url(#glow)"/>
  <path d="M 226 275 L 286 275" stroke="#0284c7" stroke-width="2"/>
  <path d="M 256 250 L 256 275" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 240 256 L 246 275" stroke="#0284c7" stroke-width="1"/>
  <path d="M 272 256 L 266 275" stroke="#0284c7" stroke-width="1"/>
  <!-- Sas d'entrée du dôme -->
  <rect x="251" y="271" width="10" height="7" rx="1.5" fill="#f8fafc"/>

  <!-- Orbite dorée dynamique enveloppant Mars -->
  <ellipse cx="256" cy="275" rx="185" ry="68" fill="none" stroke="url(#orbitGrad)" stroke-width="5" transform="rotate(-28 256 275)" stroke-linecap="round" stroke-dasharray="800 200"/>

  <!-- Balise / Vaisseau sur l'orbite -->
  <g transform="translate(390, 185)" filter="url(#glow)">
    <polygon points="0,-10 6,4 0,1 -6,4" fill="#ffffff" transform="rotate(35)"/>
    <circle cx="0" cy="0" r="3" fill="#38bdf8"/>
  </g>

  <!-- Étoile polaire / balise guide 4 branches -->
  <g transform="translate(360, 95)" fill="#f6c945" filter="url(#glow)">
    <path d="M 0 -14 Q 0 0 14 0 Q 0 0 0 14 Q 0 0 -14 0 Q 0 0 0 -14 Z" />
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
  </g>

  <!-- Texte de mission supérieur cintré : KEMET-42 -->
  <path id="textArcTop" d="M 105 220 A 175 175 0 0 1 407 220" fill="none" />
  <text font-family="'Inter', 'Montserrat', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="9">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      KEMET-42
    </textPath>
  </text>

  <!-- Texte inférieur : LUNAR & MARS OUTPOST -->
  <path id="textArcBottom" d="M 395 310 A 185 185 0 0 1 117 310" fill="none" />
  <text font-family="'Inter', 'Montserrat', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="16" fill="#94a3b8" letter-spacing="4">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      NASA SPACE APPS 2026
    </textPath>
  </text>
</svg>
